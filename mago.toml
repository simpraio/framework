[source]
paths = ["framework", "tools"]
# The benchmarks run on the test helpers, which a production checkout does not ship.
excludes = [
    "framework/cache",
    "framework/logs",
    "tools/bench",
]

[linter.rules.excessive-parameter-list]
constructor-threshold = 11

[linter.rules.too-many-methods]
threshold = 20

[linter.rules.cyclomatic-complexity]
threshold = 25

[linter.rules.no-boolean-flag-parameter]
enabled = false

[linter.rules.no-ini-set]
enabled = false
